name: Android APK Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update (for example, android-v1.0.0)"
        required: true
        type: string
      release_name:
        description: "Optional release title"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare release asset
        run: |
          mkdir -p ../release-assets
          cp app/build/outputs/apk/debug/app-debug.apk ../release-assets/calibre-web-reader-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibre-web-reader-debug-apk
          path: release-assets/calibre-web-reader-debug.apk
          if-no-files-found: error

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.tag_name || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' }}
          files: release-assets/calibre-web-reader-debug.apk
          body: |
            Debug APK for the native Calibre-Web Android reader.

            This build includes mTLS client certificate selection through Android KeyChain for servers that require mutual TLS.
